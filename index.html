<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaming Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Dashboard</h1>
        <button id="theme-toggle" onclick="toggleTheme()">Light Mode</button>
    </header>

    <main>
        <h2 class="section-title">Upcoming Releases</h2>
        <div class="timeline-frame">
        <div class="carousel-wrapper">
            <div id="carousel" class="carousel-container"></div>
        </div>
        <div class="wall left-wall"></div> <div class="wall right-wall"></div> </div>
        <section class="news-section">
            <h2 class="section-title">Latest Gaming & Tech News</h2>
            <div id="news-grid" class="news-grid">
                </div>
        </section>

        <div id="game-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="modal-close-sticky" onclick="closeModal()">&#10005;</button>
                <aside id="modal-sidebar" class="modal-sidebar"></aside>

                <div id="modal-main" class="modal-main">
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
